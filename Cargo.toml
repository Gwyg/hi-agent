[package]
name = "hi-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-openai = { version = "0.41", features = ["chat-completion"] }
async-trait = "0.1"
dotenvy = "0.15"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
