[package]
name = "hi-agent"
version = "0.1.1"
edition = "2024"
description = "hi - a terminal AI coding agent"
license = "MIT"
repository = "https://github.com/Gwyg/hi-agent"

[[bin]]
name = "hi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-openai = { version = "0.41", features = ["chat-completion"] }
async-trait = "0.1"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5"
dotenvy = "0.15"
futures = "0.3"
glob = "0.3"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
ratatui = "0.29"
regex = "1"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.1", features = ["env-filter"] }
unicode-width = "0.1"

[target.'cfg(unix)'.dependencies]
tree-sitter = "0.25"
tree-sitter-bash = "0.23"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
