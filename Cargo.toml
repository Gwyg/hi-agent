[package]
name = "hi-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-openai = { version = "0.41", features = ["chat-completion"] }
async-trait = "0.1"
dirs = "5"
dotenvy = "0.15"
futures = "0.3"
glob = "0.3"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.1", features = ["env-filter"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs"] }
